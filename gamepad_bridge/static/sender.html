<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171a1d">
  <title>手机手柄发送端</title>
  <link rel="stylesheet" href="/static/styles.css?v=4">
</head>
<body data-page="sender">
  <header class="topbar"><span class="brand">Gamepad Bridge</span><a href="/monitor">电脑监视端</a></header>
  <main class="page">
    <section class="intro">
      <div><p class="eyebrow">手机发送端</p><h1>手柄输入</h1></div>
      <div id="connection" class="status"><span class="dot"></span><span>尚未开始</span></div>
    </section>
    <section class="panel">
      <button id="start" class="primary" type="button">开始读取并传输</button>
      <p id="sender-help" class="hint">先连接手柄并按任意键，再点击开始。传输时请保持此页面位于前台。</p>
      <div id="device-status" class="notice warning" hidden></div>
      <dl class="diagnostics">
        <div><dt>安全环境</dt><dd id="secure-value">检测中</dd></div>
        <div><dt>Gamepad API</dt><dd id="api-value">检测中</dd></div>
        <div><dt>Gamepad 设备</dt><dd id="pad-count">0</dd></div>
        <div><dt>键盘模式按键</dt><dd id="keyboard-count">0</dd></div>
      </dl>
      <p id="last-event" class="hint">尚未收到设备连接事件</p>
      <details class="browser-details"><summary>浏览器信息</summary><p id="browser-value"></p></details>
      <div id="gamepads" class="controller"><div class="empty">尚未读取手柄</div></div>
    </section>
    <section class="panel robot-control-panel">
      <div class="control-heading">
        <div><p class="eyebrow">机器人控制</p><h2>WDBLH 程序</h2></div>
        <div id="robot-status" class="status"><span class="dot"></span><span>检测中</span></div>
      </div>
      <p class="hint">重启会在程序仍运行时先受控趴下；故障急停会先终止 WDBLH，再由独立控制器持续保持电机阻尼，并锁定手柄输出。</p>
      <div class="danger-actions">
        <button id="restart-wdblh" class="warning-button" type="button" disabled>重启 WDBLH</button>
        <button id="estop-wdblh" class="danger-button" type="button" disabled>故障急停</button>
      </div>
      <p id="control-result" class="hint" aria-live="polite"></p>
    </section>
  </main>
  <script src="/static/app.js?v=6"></script>
</body>
</html>
